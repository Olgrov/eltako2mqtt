name: Release validation

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q eltako2mqtt.py bridge_base.py state_feedback.py tests tools
      - run: bash -n run.sh
      - run: python tools/check_links.py
      - name: Verify immutable last 32-bit release
        run: |
          test "$(git rev-parse 'v1.3.0^{commit}')" = "7773795eea47248e04b7ebe0373b267106f27c68"
          python -c 'import subprocess,yaml; c=yaml.safe_load(subprocess.check_output(["git","show","v1.3.0:config.yaml"])); assert c["version"] == "1.3.0"; assert set(c["arch"]) == {"amd64","aarch64","armhf","armv7","i386"}'
  container:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Build production image from build.yaml
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          BUILD_FROM=$(python -c 'import os, yaml; print(yaml.safe_load(open("build.yaml"))["build_from"][os.environ["ARCH"]])')
          docker build --pull --platform "$PLATFORM" --build-arg "BUILD_FROM=$BUILD_FROM" -t eltako2mqtt:ci .
      - name: Verify packaged production entry point
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" --entrypoint python3 eltako2mqtt:ci -c \
            'from eltako2mqtt import EltakoMiniSafe2Bridge; from state_feedback import StateFeedbackBridge; import importlib.metadata as m, platform; assert EltakoMiniSafe2Bridge is StateFeedbackBridge; assert platform.python_version_tuple()[:2] == ("3","15"); print("Python", platform.python_version(), "pip", m.version("pip")); print(open("/etc/alpine-release").read().strip()); assert open("/etc/alpine-release").read().startswith("3.24"); assert m.version("paho-mqtt") == "2.2.0"'
      - name: Dependency and unit tests inside the built image
        run: |
          docker run --rm --entrypoint python3 eltako2mqtt:ci -m pip check
          echo 'Reporting outdated Python dependencies (non-blocking):'
          docker run --rm --entrypoint python3 eltako2mqtt:ci -m pip list --outdated --format=json || true
          docker run --rm --entrypoint /bin/sh eltako2mqtt:ci -c 'test -z "$(command -v gcc || true)"'
          docker run --rm --entrypoint python3 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/source:ro" -w /source eltako2mqtt:ci -m unittest discover -s tests -v
      - name: Full default-entrypoint smoke test with simulated MiniSafe and MQTT
        run: python tests/container_smoke.py eltako2mqtt:ci

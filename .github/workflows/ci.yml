name: Release validation

on:
  push:
    branches: [main, release/v1.3.0]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q eltako2mqtt.py bridge_base.py state_feedback.py tests
      - run: bash -n run.sh
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production amd64 image
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.18 -t eltako2mqtt:ci .
      - name: Verify packaged production entry point
        run: |
          docker run --rm --entrypoint python3 eltako2mqtt:ci -c \
            'from eltako2mqtt import EltakoMiniSafe2Bridge; from state_feedback import StateFeedbackBridge; import importlib.metadata as m; assert EltakoMiniSafe2Bridge is StateFeedbackBridge; assert m.version("paho-mqtt") == "2.2.0"'
